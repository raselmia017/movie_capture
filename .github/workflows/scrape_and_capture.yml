name: Movie Scraper & Link Capture

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum catalog pages to scrape (leave blank for all 407 pages)'
        required: false
        default: ''
      full_refresh:
        description: 'Re-capture links for ALL movies (ignore cache)'
        type: boolean
        required: false
        default: false

concurrency:
  group: movie-scraper
  cancel-in-progress: false

jobs:
  scrape-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Link Capture
        env:
          MAX_CATALOG_PAGES: ${{ github.event.inputs.max_pages }}
          # Script auto-runs a full refresh when 15+ days passed since the last one; this only forces it manually
          FULL_REFRESH: ${{ github.event.inputs.full_refresh == 'true' }}
          FULL_REFRESH_DAYS: '15'
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movies.json output_movies.json movies_summary.json movies_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update movie catalog and links [skip ci]" && git push)

